<svg width="600" height="48" viewBox="0 0 600 48" xmlns="http://www.w3.org/2000/svg">
  <title>Domicert report footer</title>
  <!-- Divider line -->
  <line x1="0" y1="0" x2="600" y2="0" stroke="#E5E7EB" stroke-width="0.5"/>
  <!-- Small house mark -->
  <g transform="translate(0, 8)">
    <polygon points="14,0 28,11 24,11 24,30 4,30 4,11 0,11" fill="#1D9E75"/>
    <path d="M8 17 Q8 12 14 11 Q20 12 20 17 L20 23 Q17 26 14 27 Q11 26 8 23 Z" fill="white" opacity="0.93"/>
    <polyline points="10,19 13,22 18,16" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="23" cy="14" r="5" fill="white" stroke="#0F6E56" stroke-width="1.5"/>
    <circle cx="23" cy="14" r="3" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
    <line x1="26" y1="17" x2="30" y2="22" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Inspector info placeholder -->
  <text x="42" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1A1A1A">{{COMPANY_NAME}}</text>
  <text x="42" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280">{{INSPECTOR_NAME}} · {{LICENSE_NUMBER}} · Verified Domicert Inspector</text>
  <!-- Right side Domicert branding -->
  <text x="490" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#9CA3AF">Powered by</text>
  <text x="490" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#1D9E75">Domicert</text>
  <text x="548" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#9CA3AF">domicert.ca</text>
  <text x="548" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#9CA3AF">{{PAGE_NUM}}</text>
</svg>
